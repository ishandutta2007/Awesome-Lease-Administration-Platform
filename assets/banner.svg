<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#0f766e;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="300" fill="url(#grid)" rx="12" />

  <!-- Animated Glowing Orbs -->
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;120;80" dur="8s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="220" r="120" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1000;1050" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;180;220" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Header Content -->
  <g transform="translate(60, 90)">
    <!-- Icon/Badge Group -->
    <g transform="translate(0, 0)">
      <rect width="56" height="56" rx="14" fill="url(#accent-grad)" opacity="0.9" />
      <path d="M18 16 H38 V38 H18 Z M22 22 H34 V26 H22 Z M22 30 H30 V34 H22 Z" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      Awesome Lease Administration Platform
    </text>

    <!-- Subtitle -->
    <text x="76" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated SaaS Platforms, Lease Accounting (ASC 842 / IFRS 16) &amp; Open-Source Ecosystem
    </text>
  </g>

  <!-- Dynamic Animated Tech Badges / Pills -->
  <g transform="translate(136, 210)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">ASC 842 / IFRS 16</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(152, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">Portfolio Control</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(314, 0)">
      <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">Commercial SaaS</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(486, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Open-Source ERP</text>
    </g>
  </g>

  <!-- Decorative Animated Line -->
  <path d="M 60 270 L 1140 270" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,1200;1080,1200;0,1200" dur="6s" repeatCount="indefinite" />
  </path>
</svg>
